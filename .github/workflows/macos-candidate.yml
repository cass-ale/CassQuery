name: macOS Release Candidate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true' # Secret-free ad-hoc identity only; no certificate credentials.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record runner context
        run: |
          mkdir -p evidence
          printf 'commit=%s\nrunner=%s\narch=%s\nrun=%s\n' "$GITHUB_SHA" '${{ matrix.runner }}' '${{ matrix.arch }}' "$GITHUB_RUN_ID" > evidence/runner-context.txt
          sw_vers >> evidence/runner-context.txt
          uname -m >> evidence/runner-context.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10' # Published setup-python binaries exist for both native Mac architectures.
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Locked dependencies
        run: |
          npm ci
          python -m pip install -r requirements-build.txt
          python -m pip check
      - name: Cheap fail-fast preflight
        run: npm run preflight
      - name: Native worker freeze
        run: npm run build:worker
      - name: Frozen real-CAD build, watcher and failure retention
        run: python tools/worker_smoke.py --worker dist/cassquery-worker/cassquery-worker --output evidence/worker-${{ matrix.arch }}.json
      - name: Assemble native app without publishing
        run: npx electron-builder --config packaging/electron-builder.json --mac --dir --${{ matrix.arch }} --publish never
      - name: Render the actual bundled application
        run: |
          APP=$(printf '%s\n' dist/mac-app/mac*/CassQuery.app)
          python tools/macos_smoke.py --app "$APP" --output evidence/mac-${{ matrix.arch }}
      - name: Package checked app
        run: npx electron-builder --config packaging/electron-builder.json --mac --${{ matrix.arch }} --prepackaged "$(printf '%s\n' dist/mac-app/mac*/CassQuery.app)" --publish never
      - name: Verify and launch the final DMG
        run: |
          ARCH=${{ matrix.arch }}
          if [ "$ARCH" = x64 ]; then ARCH=x86_64; fi
          python tools/dmg_smoke.py --dmg "$(printf '%s\n' dist/mac-app/*.dmg)" --arch "$ARCH" --output evidence/dmg-${{ matrix.arch }}
      - name: Candidate identity and hashes
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/mac-app/COMMIT.txt
          shasum -a 256 dist/mac-app/*.zip dist/mac-app/*.dmg > dist/mac-app/SHA256SUMS.txt
          python -m pip freeze > dist/mac-app/PYTHON-DEPENDENCIES.txt
      - name: Keep candidate and checked/not-checked evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CassQuery-mac-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/mac-app/*.zip
            dist/mac-app/*.dmg
            dist/mac-app/*.txt
            evidence/
          if-no-files-found: error
          retention-days: 14
