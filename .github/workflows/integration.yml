name: Production source integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record integration context
        run: |
          mkdir -p evidence
          printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > evidence/integration-context.txt
          uname -a >> evidence/integration-context.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Source integration dependencies
        run: |
          npm ci
          python -m pip install --only-binary=:all: -r requirements-build.txt
          python -m pip check
          google-chrome --version
      - name: Real CAD browser loop and mutation witness
        env:
          CASSQUERY_PYTHON: python
          CASSQUERY_BROWSER: /usr/bin/google-chrome
          CASSQUERY_INTEGRATION_OUTPUT: evidence/live-integration
        run: node tools/integration_suite.cjs
      - name: Validate independent report bytes
        run: node tools/integration_suite.cjs --validate-report evidence/live-integration/integration-results.json
      - name: Keep integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CassQuery-integration-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
