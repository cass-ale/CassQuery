name: macOS Release Candidate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CASSQUERY_ARCH: ${{ matrix.arch }}
      CASSQUERY_ANGLE: 'swiftshader' # Explicit packaged driver; actual WebGL software observation required.
      CSC_FOR_PULL_REQUEST: 'true' # Secret-free ad-hoc identity only.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record runner context
        run: |
          mkdir -p evidence
          printf 'commit=%s\nrunner=%s\narch=%s\nrun=%s\n' "$GITHUB_SHA" '${{ matrix.runner }}' '${{ matrix.arch }}' "$GITHUB_RUN_ID" > evidence/runner-context.txt
          sw_vers >> evidence/runner-context.txt
          uname -m >> evidence/runner-context.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: packaging/requirements-macos.lock
      - name: Locked dependencies
        run: |
          npm ci
          python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-macos.lock
          python -m pip check
      - name: Source identity snapshot
        run: python tools/release_evidence.py snapshot --output evidence/source-before.json
      - name: Cheap fail-fast preflight
        run: python tools/preflight.py --require-clean --source-before evidence/source-before.json --output evidence/preflight.json
      - name: Native worker freeze
        run: npm run build:worker
      - name: Frozen real-CAD build, watcher and failure retention
        run: python tools/worker_smoke.py --worker dist/cassquery-worker/cassquery-worker --output evidence/worker-${{ matrix.arch }}.json
      - name: Assemble native app without publishing
        run: npx electron-builder --config packaging/electron-builder.json --mac --dir --${{ matrix.arch }} --publish never
      - name: Render the actual bundled application
        run: |
          APP=$(printf '%s\n' dist/mac-app/mac*/CassQuery.app)
          python tools/macos_smoke.py --app "$APP" --output evidence/mac-${{ matrix.arch }}
      - name: Package checked app
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          arch = os.environ['CASSQUERY_ARCH']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version) or arch not in ('arm64', 'x64'):
              raise RuntimeError('Invalid owned package name')
          directory = Path('dist/mac-app')
          if directory.resolve() != Path.cwd() / directory:
              raise RuntimeError('Package output is redirected outside its owned path')
          files = [directory / f'CassQuery-{version}-mac-{arch}.{extension}'
                   for extension in ('zip', 'dmg', 'zip.blockmap', 'dmg.blockmap')]
          if any(file.is_symlink() or (file.exists() and not file.is_file()) for file in files):
              raise RuntimeError('Refusing to remove a nonregular package output')
          for file in files:
              file.unlink(missing_ok=True)
          PY
          npx electron-builder --config packaging/electron-builder.json --mac --${{ matrix.arch }} --prepackaged "$(printf '%s\n' dist/mac-app/mac*/CassQuery.app)" --publish never
      - name: Verify and launch the final ZIP
        run: |
          ARCH=${{ matrix.arch }}
          if [ "$ARCH" = x64 ]; then ARCH=x86_64; fi
          APP=$(printf '%s\n' dist/mac-app/mac*/CassQuery.app)
          python tools/zip_smoke.py --zip "$(printf '%s\n' dist/mac-app/*.zip)" --arch "$ARCH" --output evidence/zip-${{ matrix.arch }} --checked-app "$APP" --checked-inventory evidence/mac-${{ matrix.arch }}/bundle-before.json
      - name: Verify and launch the final DMG
        run: |
          ARCH=${{ matrix.arch }}
          if [ "$ARCH" = x64 ]; then ARCH=x86_64; fi
          APP=$(printf '%s\n' dist/mac-app/mac*/CassQuery.app)
          python tools/dmg_smoke.py --dmg "$(printf '%s\n' dist/mac-app/*.dmg)" --arch "$ARCH" --output evidence/dmg-${{ matrix.arch }} --checked-app "$APP" --checked-inventory evidence/mac-${{ matrix.arch }}/bundle-before.json
      - name: Verify GitHub update channel transport
        run: node tools/update_check_smoke.cjs --arch ${{ matrix.arch }} --output evidence/updatecheck-${{ matrix.arch }}.json
      - name: Native workbench editor and file dialogs
        run: |
          APP=$(printf '%s\n' dist/mac-app/mac*/CassQuery.app)
          python tools/workbench_native_smoke.py --app "$APP" --arch ${{ matrix.arch }} --output evidence/workbench-${{ matrix.arch }}
      - name: Native update installation and rollback
        run: |
          APP=$(printf '%s\n' dist/mac-app/mac*/CassQuery.app)
          python tools/update_smoke.py --app "$APP" --arch ${{ matrix.arch }} --output evidence/update-${{ matrix.arch }}
      - name: Candidate identity and hashes
        run: |
          python tools/sbom.py --output evidence/sbom.json
          python tools/release_evidence.py stage --arch ${{ matrix.arch }} --output dist/candidate-${{ matrix.arch }}
      - name: Retain failure diagnostics
        if: always()
        run: |
          if [ ! -f "dist/candidate-${{ matrix.arch }}/candidate.json" ]; then
            mkdir -p "dist/candidate-${{ matrix.arch }}"
            cp -R evidence "dist/candidate-${{ matrix.arch }}/evidence"
          fi
      - name: Keep candidate and checked/not-checked evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CassQuery-mac-${{ matrix.arch }}-${{ github.sha }}
          path: dist/candidate-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14
