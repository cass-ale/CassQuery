<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="CassQuery — a precision workspace for parametric design, with live previews and gate-checked certified models.">
<link rel="icon" href="./brand.svg" type="image/svg+xml">
<title>CassQuery</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <div class="identity"><img src="./brand.svg" width="40" height="40" alt=""><h1>CassQuery</h1></div>
  <nav class="projects" id="projects" aria-label="Projects"></nav>
  <div class="state">
    <span id="buildline" aria-live="polite"></span>
    <span class="badge" id="tierbadge" role="status">no model</span>
  </div>
</header>
<main>
  <div id="stage">
    <div id="stage-msg" role="status"><strong>Loading</strong>Fetching projects from the worker.</div>
    <div id="selection"><span class="name" id="selname"></span>
      <button id="selisolate" type="button">Isolate</button>
      <button id="selhide" type="button">Hide</button>
      <button id="selshow" type="button">Show all</button>
    </div>
  </div>
  <aside aria-label="Model controls">
    <p class="caption" id="caption"></p>
    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <div class="navrow">
      <button id="prev" type="button">Previous</button>
      <button id="next" type="button">Next</button>
    </div>
    <div class="tools">
      <label for="explode">Explode <span id="explodeval">0%</span></label>
      <input type="range" id="explode" min="0" max="100" value="0">
      <button id="xraybtn" type="button" aria-pressed="false">X-ray</button>
      <button id="buildbtn" type="button">Rebuild certified</button>
      <button id="resetview" type="button">Reset view</button>
      <pre id="diag" role="alert"></pre>
    </div>
    <ul class="chips" id="chips"></ul>
  </aside>
</main>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/addons/"
} }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
